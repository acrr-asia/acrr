# Temporary: checks the live site https://acrr.asia from a GitHub runner (the authoring
# environment has no internet access) and prints results and screenshots to the job log.
# Runs on pushes to the working branch that touch the check, or manually. Never deploys anything.
name: Live site check

on:
  push:
    branches: [claude/clever-fermat-tz2wz6]
    paths: ['.github/live-check/**', '.github/workflows/live-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node .github/live-check/check.mjs
