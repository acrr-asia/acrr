# Runs the comprehensive series review (.claude/skills/series-review/SKILL.md) when a series
# becomes complete on master (status "published" and no plannedEntries), and on demand.
# The report is uploaded as an artifact and opened as a GitHub issue.
# One-time setup: add the repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN and
# change the input below). See README.md, "Automated series review".
name: Series review

on:
  push:
    branches: [master]
    paths: ['src/content/series/**']
  workflow_dispatch:
    inputs:
      series:
        description: 'Series id (file name in src/content/series without .md)'
        required: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.detect.outputs.series }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SERIES: ${{ inputs.series }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/series-review.mjs list "$INPUT_SERIES" > /dev/null   # fails on an unknown id
            series=$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$INPUT_SERIES")
          else
            series=$(node scripts/series-review.mjs detect "$BEFORE" "$GITHUB_SHA")
          fi
          echo "Series to review: $series"
          echo "series=$series" >> "$GITHUB_OUTPUT"

  review:
    needs: detect
    if: needs.detect.outputs.series != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.detect.outputs.series) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the series review defined in .claude/skills/series-review/SKILL.md for the series
            with id "${{ matrix.series }}". Follow that procedure exactly, write the report to
            reviews/${{ matrix.series }}.md, and do not modify any other file.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Edit(/reviews/**),Bash(npm run build:local),Bash(npm run check:links),Bash(node scripts/series-review.mjs *),Bash(git rev-parse *),Bash(mkdir -p reviews)"
      - name: Check that a report was written
        run: test -s "reviews/${{ matrix.series }}.md"
      - uses: actions/upload-artifact@v4
        with:
          name: series-review-${{ matrix.series }}
          path: reviews/${{ matrix.series }}.md
      - name: Open an issue with the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIES: ${{ matrix.series }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="reviews/$SERIES.md"
          title="Series review: $(head -n 1 "$report" | sed 's/^# Series review: //')"
          # GitHub limits issue bodies to 65536 characters; long reports go to the artifact only.
          if [ "$(wc -c < "$report")" -le 60000 ]; then
            { cat "$report"; printf '\n\n---\nGenerated by the Series review workflow: %s\n' "$RUN_URL"; } > body.md
          else
            { sed -n '/^## Summary/,/^## Objectives coverage/p' "$report" | sed '$d'
              printf '\nThe full report is too long for an issue. Download the "series-review-%s" artifact from %s\n' "$SERIES" "$RUN_URL"; } > body.md
          fi
          gh issue create --title "$title" --body-file body.md
