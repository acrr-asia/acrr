# Runs the release checks and the publication gate on every pull request to master, so that content
# which fails validation is caught before it is merged (and therefore before deploy.yml publishes it).
# The same gate runs again in deploy.yml and blocks the deployment if anything slipped through.
name: Publication gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://acrr.asia

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:links
      - run: node scripts/series-pipeline.mjs gate
