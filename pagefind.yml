# Pagefind configuration (picked up automatically by `pagefind --site dist`).
#
# KaTeX renders every formula three times: visual HTML (.katex-html), MathML, and a TeX
# <annotation>. Indexing all three makes search excerpts read "hhh" for a single "h".
# Excluding the visual HTML and the annotation leaves one copy (the MathML) in the index.
site: dist
exclude_selectors:
  - ".katex-html"
  - "annotation"
