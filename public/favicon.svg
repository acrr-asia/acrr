<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ACRR">
  <title>ACRR</title>
  <style>
    /* Single-colour mark; hex values mirror --accent in src/styles/tokens.css. */
    .mark { stroke: #0f5c5c; fill: none; }
    .node { fill: #0f5c5c; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #6fc4c0; }
      .node { fill: #6fc4c0; }
    }
  </style>
  <!-- An "A" drawn as two links meeting at a joint, with a crossbar. -->
  <g class="mark" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 26 16 6l9.5 20" />
    <path d="M9.8 19h12.4" />
  </g>
  <circle class="node" cx="16" cy="6" r="3" />
</svg>
